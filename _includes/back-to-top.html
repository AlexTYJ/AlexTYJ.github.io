{% comment %}
  Scroll-to-top button. Starts invisible and is only revealed by
  assets/js/site-extras.js once the page is scrolled, so with JavaScript off it
  simply never appears.
{% endcomment %}
<button class="back-to-top" type="button" aria-label="Back to top" title="Back to top">
  <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
</button>
